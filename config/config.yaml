# FedSpeak Configuration
# Based on Document 02 ground truth catalog and Document 03 validated parameters

# Target keywords from Document 02 catalog
keywords:
  - word: "transitory"
    type: "deletion"
    context: "inflation narrative"
    shift_id: "SHIFT-2021-01"
    significance: |
      Fed used "transitory" to describe inflation surge from April-November 2021.
      Removal in December 2021 signaled shift from temporary to persistent
      inflation framing, indicating policy pivot toward rate increases.
    enabled: true
    priority: "high"
    synonyms:
      - "transient"
      - "temporary"
      - "short-lived"

  - word: "accommodative"
    type: "deletion"
    context: "policy stance"
    shift_id: "SHIFT-2018-01"
    significance: |
      "Accommodative" described Fed's supportive policy stance.
      Removal in September 2018 signaled end of post-crisis accommodation,
      transition to neutral/restrictive policy.
    enabled: true
    priority: "high"
    synonyms:
      - "supportive"
      - "accommodating"
      - "easy"

  - word: "patient"
    type: "deletion"
    context: "forward guidance"
    shift_id: "SHIFT-2015-01"
    significance: |
      "Patient" in 2014-2015 signaled Fed would wait before raising rates.
      Removal in March 2015 indicated liftoff was imminent (occurred Dec 2015).
    enabled: true
    priority: "medium"
    synonyms:
      - "gradual"
      - "measured"
      - "deliberate"

  - word: "considerable time"
    type: "substitution"
    context: "forward guidance"
    shift_id: "SHIFT-2014-01"
    significance: |
      "Considerable time" was forward guidance phrase 2013-2014.
      Substitution with "patient" in December 2014 marked transition
      toward liftoff preparation.
    enabled: true
    priority: "medium"
    synonyms:
      - "extended period"
      - "substantial period"
      - "significant time"

  - word: "full range of tools"
    type: "addition"
    context: "crisis response"
    shift_id: "SHIFT-2020-01"
    significance: |
      Added in March 2020 during COVID crisis.
      Signaled Fed's readiness to use unconventional policy tools
      (QE, forward guidance, emergency facilities).
    enabled: true
    priority: "high"
    synonyms:
      - "all available tools"
      - "complete toolkit"
      - "entire toolkit"

# Detection algorithm parameters (from Document 03 testing)
detection:
  # Number of consecutive documents at count=0 to confirm removal
  sustained_removal_threshold: 3

  # Baseline calculation window (months)
  baseline_window_months: 6

  # Minimum documents needed for baseline calculation
  min_baseline_samples: 3

  # Primary document type for detection
  focus_document_type: "policy_statement"  # minutes lag 3 weeks

  # Improved Hybrid Detector parameters (Phase 0 validated)
  hybrid_detector:
    # Lookback window: number of previous documents for context
    lookback: 3

    # Increase detection: term count increased by this factor
    increase_threshold: 2.0

    # Decrease detection: term count decreased by this factor
    decrease_threshold: 0.5

    # Statistical significance threshold (Fisher's exact test p-value)
    p_value_threshold: 0.05

    # Confidence levels to include in results (filter low-confidence detections)
    confidence_filter:
      - "medium"
      - "high"

    # Minimum term count for increase detection
    min_count_increase: 2

    # Minimum average count for decrease detection
    min_avg_decrease: 1.0

# Text extraction validation thresholds
validation:
  min_word_count_statement: 100
  min_word_count_minutes: 1000

# Corpus configuration
corpus:
  start_date: "1994-01-01"  # Extended corpus from when Fed started online publishing
  end_date: "2025-12-31"    # Through present
  data_dir: "data/"
  raw_subdir: "raw/"
  processed_subdir: "processed/"
  metadata_subdir: "metadata/"

# Document download settings
download:
  delay_seconds: 1        # Rate limiting (respectful server usage)
  retry_attempts: 3       # Maximum retry attempts
  timeout_seconds: 30     # Request timeout
  backoff_base: 1         # Exponential backoff base (1s, 2s, 4s)
  user_agent: "FedSpeak/1.0 (Academic Research)"

# URL templates for Fed documents
url_templates:
  policy_statement: "https://www.federalreserve.gov/newsevents/pressreleases/monetary{date}a.htm"
  fomc_minutes: "https://www.federalreserve.gov/monetarypolicy/fomcminutes{date}.htm"
  beige_book: "https://www.federalreserve.gov/monetarypolicy/beigebook{date}.htm"

# Alert configuration
alerts:
  output_dir: "results/alerts/"
  output_formats:
    - "json"
    - "text"
  include_visualization: true
  visualization_dir: "results/visualizations/"
  confidence_levels:
    high: "matches known pattern from catalog"
    medium: "new word following known pattern"
    low: "uncertain pattern requiring manual review"

# Logging configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_dir: "logs/"
  log_to_console: true
  log_to_file: true

# Phase 4: Real-time monitoring configuration
monitoring:
  rss_feed_url: "https://www.federalreserve.gov/feeds/press_monetary.xml"
  check_interval_seconds: 300  # Check every 5 minutes
  statement_pattern: "(?i)fomc.*statement"  # Regex to filter RSS entries

# Phase 4: Alert distribution configuration
distribution:
  email:
    enabled: false  # Set to true after testing
    smtp_server: "localhost"
    smtp_port: 1025
    smtp_from: "fedspeak@localhost"
    smtp_tls: false  # Set true for production SMTP
    recipients:
      - "analyst@example.com"  # Replace with actual recipients

  dashboard:
    enabled: true
    host: "localhost"
    port: 5000
    debug: true  # Set false for production
    alerts_per_page: 50
    max_age_days: 90  # Show alerts from last 90 days

# Phase 5: Market Data Validation Configuration
market_validation:
  enabled: true

  # API Configuration
  apis:
    fred:
      enabled: true
      api_key: "${FRED_API_KEY}"  # Set FRED_API_KEY environment variable
      base_url: "https://api.stlouisfed.org/fred"
      rate_limit: 120  # requests per minute

    alpha_vantage:
      enabled: false  # Fallback if needed
      api_key: "${ALPHAVANTAGE_API_KEY}"
      base_url: "https://www.alphavantage.co/query"
      rate_limit: 5  # free tier: 5 per minute, 500 per day

    yahoo_finance:
      enabled: true  # Free, no API key needed
      rate_limit: 2000  # per hour

  # Indicators and Thresholds
  indicators:
    treasury_2yr:
      enabled: true
      fred_series: "DGS2"
      threshold_bps: 5  # basis points
      weight: 0.20

    treasury_10yr:
      enabled: true
      fred_series: "DGS10"
      threshold_bps: 5  # basis points
      weight: 0.20

    vix:
      enabled: true
      symbol: "^VIX"
      threshold_pct: 10  # percent change
      weight: 0.30

    sp500:
      enabled: true
      symbol: "SPY"  # S&P 500 ETF
      threshold_pct: 0.5  # percent change
      weight: 0.30

  # Time Windows
  time_windows:
    baseline:
      hours_before: 3  # 11 AM - 2 PM baseline
      end_minutes_before: 15

    impact_primary:
      minutes_after: 30  # Main validation window (2:00-2:30 PM ET)

    impact_extended:
      minutes_after: 60  # Extended validation (2:00-3:00 PM ET)

  # Validation Criteria
  validation:
    min_score: 0.6  # Need 60% of weighted indicators
    min_indicators: 2  # At least 2 indicators must trigger

  # Alert Tier Rules
  tiers:
    tier_1:  # Statistical + Market validated (best quality)
      statistical_confidence: ["high", "medium"]
      market_validated: true

    tier_2:  # Statistical only (not market validated)
      statistical_confidence: ["high", "medium"]
      market_validated: false

    tier_3:  # Low confidence, informational
      statistical_confidence: ["low"]

  # Storage
  storage:
    cache_dir: "data/market_cache/"
    retention_days: 90
    format: "csv"  # csv for simplicity, can upgrade to parquet

  # Backtesting
  backtest:
    enabled: true
    start_date: "2009-01-01"
    end_date: "2024-12-31"
    output_dir: "results/market_validation/"

# Phase 6: Media Coverage Validation Configuration
media_validation:
  enabled: true

  # API Configuration
  apis:
    gdelt:
      enabled: true
      base_url: "https://api.gdeltproject.org/api/v2"
      rate_limit: null  # Unlimited (GDELT is free)
      timeout: 30  # seconds
      search_window_hours: 24  # 24 hours post-FOMC for media coverage

    finbert:
      enabled: true
      model_name: "yiyanghkust/finbert-tone"  # Finance-specific BERT
      device: "cpu"  # or "cuda" if GPU available
      batch_size: 8

  # Indicators and Thresholds
  indicators:
    coverage_volume:
      enabled: true
      threshold_articles: 50  # Minimum 50 articles mentioning term
      weight: 0.35
      description: "Number of articles mentioning the term within 24 hours"

    source_diversity:
      enabled: true
      threshold_sources: 15  # Minimum 15 unique sources
      weight: 0.35
      description: "Number of unique news sources covering the shift"

    sentiment_significance:
      enabled: true
      threshold_abs_score: 0.3  # |avg sentiment| >= 0.3
      weight: 0.30
      description: "Absolute average sentiment score (hybrid FinBERT + GDELT)"

  # Sentiment Analysis Settings
  sentiment:
    top_n_articles: 20  # Analyze sentiment of top 20 articles (efficiency)
    min_article_length: 50  # Minimum words for sentiment analysis
    hybrid_weights:
      gdelt_tone: 0.4  # Weight for GDELT tone scores
      finbert_sentiment: 0.6  # Weight for FinBERT predictions

    # Priority news sources (high-quality financial journalism)
    priority_sources:
      - "reuters.com"
      - "bloomberg.com"
      - "wsj.com"
      - "ft.com"
      - "nytimes.com"
      - "cnbc.com"
      - "marketwatch.com"
      - "apnews.com"
      - "federalreserve.gov"
      - "economist.com"

  # Validation Criteria
  validation:
    min_score: 0.6  # Need 60% of weighted indicators
    min_indicators: 2  # At least 2 indicators must trigger

  # Multi-Signal Tier Rules (Statistical + Market + Media)
  tiers:
    tier_1:  # Triple validated (Statistical + Market + Media)
      statistical_confidence: ["high", "medium"]
      market_validated: true
      media_validated: true
      description: "Gold standard - all three signals confirm shift"

    tier_2:  # Dual validated (Statistical + Market OR Media)
      statistical_confidence: ["high", "medium"]
      external_validated: 1  # At least 1 external signal (market or media)
      description: "Strong evidence - statistical plus one external signal"

    tier_3:  # Statistical only
      statistical_confidence: ["high", "medium"]
      external_validated: 0
      description: "Statistical detection only, no external confirmation"

  # Storage
  storage:
    cache_dir: "data/media_cache/"
    retention_days: 90
    format: "json"

  # GDELT Search Configuration
  search:
    query_template: "(FOMC OR \"Federal Reserve\") AND {term} AND (statement OR policy OR monetary)"
    source_language: "english"
    max_records: 250  # GDELT limit per query

    # Keywords to exclude (reduce noise)
    exclude_keywords:
      - "opinion"
      - "editorial"
      - "blog"
      - "comment"

# Phase 8: MILA Framework & Explainability
explainability:
  mila:
    enabled: true
    provider: "anthropic"  # LLM provider (anthropic/openai)
    api_key: "${ANTHROPIC_API_KEY}"  # API key from environment variable
    model: "claude-3-5-sonnet-20241022"  # Claude model for stance analysis
    max_tokens: 2048  # Maximum tokens for response
    temperature: 0.1  # Low temperature for consistency (0.0-1.0)

    # Cost Control
    budget_alert_threshold: 500.0  # Alert if monthly cost exceeds this (USD)
    daily_request_limit: 100  # Maximum API calls per day (safety limit)

    # Caching
    cache_dir: "data/mila_cache"
    cache_retention_days: 365  # Keep stance analyses for 1 year (statements don't change)

    # Stance Scoring
    stance_definitions:
      hawkish: "Favors tighter monetary policy (rate increases, reducing accommodation)"
      dovish: "Favors looser monetary policy (rate cuts, maintaining accommodation)"
      neutral: "Balanced or data-dependent stance"

  # Visualization Settings
  visualizations:
    enabled: true
    timeline_default_range_years: 2  # Default to last 2 years
    chart_theme: "professional"  # Chart.js theme

  # Dashboard Settings
  dashboard:
    enabled: true
    default_statement_limit: 50  # Number of statements to show in dropdowns
    enable_comparison_view: true  # Allow side-by-side statement comparison
    enable_diff_view: true  # Show text diff between statements
